resources:
  jobs:
    healthcare_daily_pipeline:
      name: healthcare_daily_pipeline
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: /Workspace/Shared/healthcare-medallion/notebooks/00_setup_config
          job_cluster_key: healthcare_cluster
        - task_key: bronze
          depends_on: [{task_key: setup}]
          notebook_task:
            notebook_path: /Workspace/Shared/healthcare-medallion/notebooks/01_ingest_bronze
          job_cluster_key: healthcare_cluster
          max_retries: 3
          min_retry_interval_millis: 30000
        - task_key: silver_patients
          depends_on: [{task_key: bronze}]
          notebook_task: {notebook_path: /Workspace/Shared/healthcare-medallion/notebooks/02_silver_patients}
          job_cluster_key: healthcare_cluster
        - task_key: silver_appointments
          depends_on: [{task_key: bronze}]
          notebook_task: {notebook_path: /Workspace/Shared/healthcare-medallion/notebooks/03_silver_appointments}
          job_cluster_key: healthcare_cluster
        - task_key: silver_billing
          depends_on: [{task_key: bronze}]
          notebook_task: {notebook_path: /Workspace/Shared/healthcare-medallion/notebooks/04_silver_billing}
          job_cluster_key: healthcare_cluster
        - task_key: silver_doctors_treatments
          depends_on: [{task_key: bronze}]
          notebook_task: {notebook_path: /Workspace/Shared/healthcare-medallion/notebooks/05_silver_doctors_treatments}
          job_cluster_key: healthcare_cluster
        - task_key: gold
          depends_on:
            - {task_key: silver_patients}
            - {task_key: silver_appointments}
            - {task_key: silver_billing}
            - {task_key: silver_doctors_treatments}
          notebook_task: {notebook_path: /Workspace/Shared/healthcare-medallion/notebooks/06_gold_kpis}
          job_cluster_key: healthcare_cluster
        - task_key: audit
          depends_on: [{task_key: gold}]
          notebook_task: {notebook_path: /Workspace/Shared/healthcare-medallion/notebooks/07_audit_report}
          job_cluster_key: healthcare_cluster
      job_clusters:
        - job_cluster_key: healthcare_cluster
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 2
